[project]
name = "pipe2"
version = "2026.08.0"
description = "Pipe2.ai Python SDK — typed GraphQL client"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
keywords = ["pipe2", "ai", "api", "sdk", "text-to-video", "video-generation", "image-generation", "text-to-speech"]
urls = { Homepage = "https://pipe2.ai" }
dependencies = ["httpx>=0.25", "pydantic>=2.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pipe2"]

[tool.ariadne-codegen]
schema_path = "../graphql/user-schema.graphql"
queries_path = "../graphql/operations/"
target_package_name = "generated"
target_package_path = "pipe2/"
client_name = "Pipe2GraphQLClient"
async_client = true
files_to_include = []
